                /* -------------------------------------------------- superTrunfo */

                // The Super Trunfo rule played through the interface: the trump
                // beats every card except a "1" card, which beats it. The hands
                // are set directly (and the board repainted) so the round under
                // test is the one on the table, whatever the deal would have been.
                var SUPER_THEME = {
                    id: 'super-browser',
                    theme: 'Super Browser',
                    attributes: ['size', 'speed'],
                    units: { size: 'cm', speed: 'km/h' },
                    cards: [
                        { name: 'One', attributes: { size: 10, speed: 10 }, icon: '🦁' },
                        { name: 'Two', attributes: { size: 20, speed: 20 }, icon: '🐘' },
                        { name: 'Three', attributes: { size: 30, speed: 30 }, icon: '🐆' },
                        { name: 'Four', attributes: { size: 40, speed: 40 }, icon: '🦒' },
                        {
                            name: 'Trump',
                            attributes: { size: 1, speed: 1 },
                            icon: '🐊',
                            superTrunfo: true
                        },
                        { name: 'Five', attributes: { size: 50, speed: 50 }, icon: '🦍' },
                        { name: 'Six', attributes: { size: 60, speed: 60 }, icon: '🦘' },
                        { name: 'Seven', attributes: { size: 70, speed: 70 }, icon: '🦓' }
                    ]
                };

                function superTrunfo() {
                    window.TrunfoUI.configure({ fast: true, ai: 'random' });
                    var deck = Engine.createDeck(SUPER_THEME);
                    var trump = deck[4];
                    var one = deck[0];
                    // "Ordinary" has to be outside the first group: every card of
                    // group 1 is a "1" card, and those beat the trump.
                    var ordinary = deck[5];

                    check('the trump card opens the second group', trump.code === '2A', trump.code);
                    check(
                        'the "1" cards are the whole first group',
                        deck.filter(function (card) {
                            return Engine.isNumberOneCard(card);
                        }).length === 4
                    );

                    // The rule, card against card: the trump takes everything
                    // except a "1" card, and the values never decide it.
                    var swept = Engine.compareCards(trump, ordinary, 'speed');
                    check(
                        'the trump beats an ordinary card whatever the values',
                        swept.outcome === Engine.PLAYER &&
                            swept.playerValue === 1 &&
                            swept.trumpBeaten === false,
                        JSON.stringify([swept.outcome, swept.playerValue, swept.computerValue])
                    );

                    /** Resolve once the board is not mid-deal and not mid-reveal. */
                    function idle() {
                        return new Promise(function (resolve) {
                            var until = Date.now() + 3000;
                            (function poll() {
                                if (!byId('board').classList.contains('is-busy') || Date.now() > until) {
                                    resolve();
                                    return;
                                }
                                window.setTimeout(poll, 50);
                            })();
                        });
                    }

                    /** Every status line the board paints over the next `ms`. */
                    function watchStatus(ms, latch) {
                        return new Promise(function (resolve) {
                            var seen = '';
                            var until = Date.now() + ms;
                            (function sample() {
                                seen += ' ' + byId('message').textContent;
                                if (latch && document.querySelector('#computer-card .face.is-super')) {
                                    latch.computerSuper = true;
                                }
                                if (Date.now() >= until) {
                                    resolve(seen);
                                    return;
                                }
                                window.setTimeout(sample, 60);
                            })();
                        });
                    }

                    /** Put these two cards on the table and hand the turn over. */
                    function table(playerCards, computerCards) {
                        var state = window.TrunfoUI.getState();
                        state.playerHand = playerCards;
                        state.computerHand = computerCards;
                        state.drawPile = [];
                        state.turn = 'player';
                        window.TrunfoUI.render();
                    }

                    // The player holds the trump against the computer's "1" card:
                    // the "1" card takes the round, however the values fall.
                    window.TrunfoUI.startGame(SUPER_THEME);
                    idle()
                        .then(function () {
                            table([trump, deck[5]], [one, deck[6]]);
                            var seal = document.querySelector('#player-card .seal__text');
                            var badge = document.querySelector('#player-card .badge__text');
                            check(
                                'the trump card carries the Super Trunfo seal',
                                !!seal && seal.textContent === 'Super Trunfo',
                                seal ? seal.textContent : 'no seal'
                            );
                            check(
                                'the trump card still shows its own code',
                                !!badge && badge.textContent === '2A',
                                badge ? badge.textContent : 'no badge'
                            );

                            window.TrunfoUI.onCategory('size');
                            return watchStatus(1100).then(function (seen) {
                                check(
                                    'a "1" card takes the round off the Super Trunfo',
                                    /beats the Super Trunfo/.test(seen) &&
                                        /Computer wins the round/.test(seen),
                                    seen.trim().slice(-140)
                                );
                                check(
                                    'the round reports the two values it compared',
                                    /Size: you 1 vs computer 10/.test(seen),
                                    seen.trim().slice(-140)
                                );

                                // The other way round, in a fresh game: the player
                                // holds the "1" card and the computer the trump.
                                window.TrunfoUI.startGame(SUPER_THEME);
                                return idle().then(function () {
                                    table([one, deck[5]], [trump, deck[6]]);
                                    var latch = {};
                                    window.TrunfoUI.onCategory('size');
                                    return watchStatus(1100, latch).then(function (second) {
                                        check(
                                            'the "1" card wins the round and says why',
                                            /beats the Super Trunfo/.test(second) &&
                                                /You win the round/.test(second),
                                            second.trim().slice(-140)
                                        );
                                        check(
                                            'the computer’s trump is revealed with its seal',
                                            latch.computerSuper === true
                                        );
                                        report();
                                    });
                                });
                            });
                        })
                        .catch(function (error) {
                            check('the trump case ran to completion', false, error.message);
                            report();
                        });
                }

                /* ------------------------------------------------------------ paper */

                // The card stock is generated by a WebGL fragment shader, with
                // the CSS gradients as the documented fallback.
                function paper() {
                    window.TrunfoUI.startGame();

                    var Paper = window.TrunfoPaper;
                    var root = document.documentElement;
                    var face = document.querySelector('#player-card .face');

                    check('the shader module loaded', !!Paper);
                    check('a card is on screen to texture', !!face);
                    if (!Paper || !face) {
                        report();
                        return;
                    }

                    check(
                        'the shader compiles on this machine',
                        Paper.isSupported(),
                        JSON.stringify(Paper.status())
                    );

                    var tile = Paper.texture();
                    var isDataUrl = typeof tile === 'string' && tile.indexOf('data:image/') === 0;
                    check(
                        'the shader renders a tile',
                        isDataUrl,
                        isDataUrl ? Math.round(tile.length / 1024) + ' KB' : String(tile)
                    );
                    check(
                        'the tile carries real texture, not a flat fill',
                        isDataUrl && tile.length > 2000,
                        isDataUrl ? String(tile.length) : '-'
                    );

                    check(
                        'the texture is published to CSS',
                        /url\("data:image\//.test(getComputedStyle(root).getPropertyValue('--paper-grain'))
                    );
                    check(
                        'the tile size is published too',
                        /px/.test(getComputedStyle(root).getPropertyValue('--paper-grain-size'))
                    );
                    check(
                        'the card paints the texture as a full-card overlay',
                        /data:image\//.test(getComputedStyle(face, '::after').backgroundImage),
                        getComputedStyle(face, '::after').backgroundImage.slice(0, 40)
                    );
                    check(
                        'the overlay never swallows a click',
                        getComputedStyle(face, '::after').pointerEvents === 'none',
                        getComputedStyle(face, '::after').pointerEvents
                    );
                    check(
                        'the overlay blends into the card only',
                        getComputedStyle(face, '::after').mixBlendMode === 'multiply' &&
                            getComputedStyle(face).isolation === 'isolate',
                        getComputedStyle(face, '::after').mixBlendMode +
                            ' / ' +
                            getComputedStyle(face).isolation
                    );

                    // The back is a different surface: lacquered, not matte.
                    var back = document.querySelector('#computer-card .back');
                    var sheen = Paper.texture('gloss');
                    check('the card back is on screen', !!back);
                    check(
                        'the gloss shader renders its own tile',
                        typeof sheen === 'string' && sheen.indexOf('data:image/') === 0,
                        typeof sheen === 'string' ? Math.round(sheen.length / 1024) + ' KB' : String(sheen)
                    );
                    check('the gloss tile is not the paper tile', sheen !== tile);
                    check(
                        'the sheen is published to CSS',
                        /url\("data:image\//.test(getComputedStyle(root).getPropertyValue('--gloss-sheen'))
                    );
                    check(
                        'the back paints the sheen texture',
                        /data:image\//.test(getComputedStyle(back, '::after').backgroundImage),
                        getComputedStyle(back, '::after').backgroundImage.slice(0, 40)
                    );
                    check(
                        'the back is shiny, not matte',
                        getComputedStyle(back, '::after').mixBlendMode === 'screen' &&
                            getComputedStyle(back, '::before').mixBlendMode === 'screen',
                        getComputedStyle(back, '::after').mixBlendMode +
                            ' / ' +
                            getComputedStyle(back, '::before').mixBlendMode
                    );
                    check(
                        'the back carries a specular highlight',
                        /radial-gradient/.test(getComputedStyle(back, '::before').backgroundImage)
                    );
                    check(
                        'the gloss overlays never swallow a click',
                        getComputedStyle(back, '::after').pointerEvents === 'none' &&
                            getComputedStyle(back, '::before').pointerEvents === 'none'
                    );

                    // The reflection belongs to the lamp over the table: the cursor
                    // leans the card and the lean moves the light. Asserted below,
                    // once the opening deal has settled.

                    // Fallback: with no WebGL the gradients must stand alone.
                    var original = HTMLCanvasElement.prototype.getContext;
                    HTMLCanvasElement.prototype.getContext = function () {
                        return null;
                    };
                    root.style.removeProperty('--paper-grain');
                    root.style.removeProperty('--gloss-sheen');
                    Paper.reset();

                    var applied = Paper.apply(root, {});
                    HTMLCanvasElement.prototype.getContext = original;

                    check(
                        'the shader reports failure when WebGL is missing',
                        applied === false,
                        JSON.stringify(Paper.status())
                    );
                    check(
                        'neither texture is published when it fails',
                        getComputedStyle(root).getPropertyValue('--paper-grain').trim() === '' &&
                            getComputedStyle(root).getPropertyValue('--gloss-sheen').trim() === ''
                    );
                    check(
                        'the card keeps its gradients without the shader',
                        /gradient/.test(getComputedStyle(face).backgroundImage),
                        getComputedStyle(face).backgroundImage.slice(0, 48)
                    );
                    check(
                        'the back keeps its pattern without the shader',
                        /gradient/.test(getComputedStyle(back).backgroundImage),
                        getComputedStyle(back).backgroundImage.slice(0, 48)
                    );

                    // Put it back so the final state matches a normal load.
                    Paper.reset();
                    check('the shader recovers afterwards', Paper.apply(root, {}) === true);

                    // The reflection is driven by the card's pose, never the
                    // pointer. Wait for the opening deal to finish and for the
                    // tracker to settle before reading the resting position.
                    var slot = byId('computer-slot');
                    var spotOf = function () {
                        return (
                            slot.style.getPropertyValue('--gloss-x') +
                            ' , ' +
                            slot.style.getPropertyValue('--gloss-y')
                        );
                    };
                    var pair = function (value) {
                        var parts = String(value).split(',');
                        return { x: parseFloat(parts[0]), y: parseFloat(parts[1]) };
                    };
                    // The tracker writes the reflection back out of a transform it
                    // read from the computed style, so "back at rest" can land a
                    // fraction of a percent off the value it started from. What
                    // matters is where the reflection sits, not the text it was
                    // serialised as — a real swing is several percent away.
                    var gap = function (from, to) {
                        var a = pair(from);
                        var b = pair(to);
                        return Math.max(Math.abs(a.x - b.x), Math.abs(a.y - b.y));
                    };

                    window.setTimeout(function () {
                        var resting = spotOf();
                        check('a resting reflection is placed on the card', /%/.test(resting), resting);
                        check(
                            'the card has depth to lean into',
                            getComputedStyle(slot).perspective !== 'none',
                            getComputedStyle(slot).perspective
                        );

                        // The cursor leans the card. The reflection must not follow
                        // the pointer; it follows the *pose the pointer produced*,
                        // which is why it swings the other way.
                        var card = byId('computer-card');
                        var slotRect = slot.getBoundingClientRect();
                        slot.dispatchEvent(
                            new PointerEvent('pointermove', {
                                clientX: slotRect.left + slotRect.width * 0.9,
                                clientY: slotRect.top + slotRect.height * 0.85,
                                bubbles: true
                            })
                        );
                        check(
                            'the lean is expressed as a tilt',
                            parseFloat(slot.style.getPropertyValue('--tilt-y')) > 5 &&
                                parseFloat(slot.style.getPropertyValue('--tilt-x')) < -5,
                            slot.style.getPropertyValue('--tilt-y') +
                                ' / ' +
                                slot.style.getPropertyValue('--tilt-x')
                        );
                        check(
                            'the shadow is thrown away from the lean',
                            parseFloat(slot.style.getPropertyValue('--shadow-x')) < 0,
                            slot.style.getPropertyValue('--shadow-x')
                        );

                        // The transform is transitioned and the reflection is sampled
                        // on the next frame, so let both land before reading them.
                        window.setTimeout(function () {
                            check(
                                'the cursor leans the card into 3D',
                                getComputedStyle(card).transform.indexOf('matrix3d') === 0,
                                getComputedStyle(card).transform.slice(0, 42)
                            );
                            var leaning = spotOf();
                            check(
                                'the reflection swings against the lean',
                                parseFloat(leaning) < parseFloat(resting),
                                resting + ' -> ' + leaning
                            );

                            // And it eases back to rest when the cursor leaves.
                            slot.dispatchEvent(new PointerEvent('pointerleave', { bubbles: false }));
                            window.setTimeout(function () {
                                check(
                                    'the card eases back when the cursor leaves',
                                    !slot.classList.contains('is-tilting') && gap(spotOf(), resting) < 1,
                                    resting + ' -> ' + spotOf()
                                );

                                // A deal carries the card under the lamp, so the
                                // reflection has to travel with it too.
                                byId('restart-btn').click();
                                window.setTimeout(function () {
                                    var during = spotOf();
                                    check(
                                        'the reflection travels while the card is dealing',
                                        gap(during, resting) > 1,
                                        resting + ' -> ' + during
                                    );
                                    window.setTimeout(function () {
                                        check(
                                            'the reflection settles once the card does',
                                            gap(spotOf(), resting) < 1,
                                            resting + ' -> ' + spotOf()
                                        );
                                        report();
                                    }, 2400);
                                }, 220);
                            }, 800);
                        }, 320);
                    }, 2600);
                }

                /* -------------------------------------------------------- lowerWins */

                // A stat can be won by the lowest value. The card marks it, and
                // the round must follow the deck's rule, not the raw numbers.
                function lowerWins() {
                    var theme = {
                        id: 'lower-browser',
                        theme: 'Lower Browser',
                        attributes: ['price', 'speed'],
                        labels: { price: 'Price', speed: 'Speed' },
                        units: { price: '$', speed: 'km/h' },
                        directions: { price: 'lower' },
                        cards: [
                            { name: 'Cheap', attributes: { price: 10, speed: 50 } },
                            { name: 'Fast', attributes: { price: 40, speed: 120 } }
                        ]
                    };

                    window.TrunfoUI.startGame(theme);
                    var state = window.TrunfoUI.getState();

                    check(
                        'the deck stores its comparison rule',
                        state.directions.price === 'lower',
                        state.directions.price
                    );
                    check(
                        'an unlisted stat stays higher-wins',
                        state.directions.speed === 'higher',
                        state.directions.speed
                    );

                    var lowerRow = document.querySelector('#player-card button.attr[data-category="price"]');
                    var upperRow = document.querySelector('#player-card button.attr[data-category="speed"]');
                    check(
                        'the lower-wins stat is marked on the card',
                        !!lowerRow && !!lowerRow.querySelector('.attr__rule')
                    );
                    check(
                        'the higher-wins stat carries no marker',
                        !!upperRow && !upperRow.querySelector('.attr__rule')
                    );
                    check(
                        'the accessible name explains the rule',
                        !!lowerRow && /lowest value wins/i.test(lowerRow.getAttribute('aria-label')),
                        lowerRow ? lowerRow.getAttribute('aria-label') : 'no row'
                    );

                    // With two distinct prices there is always a winner, whichever
                    // way the deal fell — and it must be the cheaper car.
                    var playerCard = Engine.getTopCard(state.playerHand);
                    var computerCard = Engine.getTopCard(state.computerHand);
                    var expected =
                        playerCard.attributes.price < computerCard.attributes.price ? 'player' : 'computer';

                    window.TrunfoUI.onCategory('price');
                    var result = window.TrunfoUI.getState().lastResult;
                    check(
                        'the round follows the lower-wins rule',
                        result.outcome === expected,
                        result.playerValue + ' vs ' + result.computerValue + ' -> ' + result.outcome
                    );
                    check('the rule is on the round result', result.direction === 'lower', result.direction);
                    check(
                        'the message names the rule',
                        /lowest wins/.test(byId('message').textContent),
                        byId('message').textContent
                    );

                    report();
                }

                /* -------------------------------------------------------------- flip */

                // Regression: the flip keyframes end on an identity transform, but
                // `fill: both` leaves it applied. `perspective()` puts the element
                // in a 3D rendering context, and an element in a 3D rendering
                // context cannot blend with its backdrop — so a flip used to turn
                // the gloss overlays into flat paint and wash the back out to a
                // featureless gradient after the first turn.
                function flip() {
                    window.TrunfoUI.startGame();

                    var slot = byId('computer-slot');
                    var card = byId('computer-card');
                    var attempts = 0;

                    function layersIn3d() {
                        var stuck = [];
                        [card, card.querySelector('.back'), card.querySelector('.face')].forEach(
                            function (node) {
                                if (!node) return;
                                var transform = getComputedStyle(node).transform;
                                if (transform.indexOf('matrix3d') === 0) stuck.push(node.className);
                            }
                        );
                        return stuck;
                    }

                    window.setTimeout(function playRound() {
                        var button = document.querySelector('#player-card button.attr:not(:disabled)');
                        if (button && attempts === 0) button.click();
                        attempts += 1;

                        // Settle on the card being face-DOWN: that is when the gloss
                        // layers exist, and the `.card--back` rule is the one that
                        // decides whether they sit in a 3D rendering context.
                        var settled =
                            !card.classList.contains('flip-in') &&
                            !card.classList.contains('flip-out') &&
                            card.classList.contains('card--back');

                        if (!settled && attempts < 100) {
                            window.setTimeout(playRound, 120);
                            return;
                        }

                        check(
                            'the flip class clears once its animation ends',
                            settled,
                            card.className + ' after ' + attempts + ' checks'
                        );

                        var back = card.querySelector('.back');
                        if (back) {
                            check(
                                'the back keeps no lingering 3D transform',
                                getComputedStyle(back).transform === 'none',
                                getComputedStyle(back).transform.slice(0, 48)
                            );
                        }

                        var stuck = layersIn3d();
                        check(
                            'no card layer is left in a 3D rendering context',
                            stuck.length === 0,
                            stuck.join(' | ')
                        );

                        if (back) {
                            check(
                                'the gloss overlays still blend after a flip',
                                getComputedStyle(back, '::after').mixBlendMode === 'screen' &&
                                    getComputedStyle(back, '::before').mixBlendMode === 'screen',
                                getComputedStyle(back, '::after').mixBlendMode
                            );
                        }

                        // `mix-blend-mode` keeps computing to `screen` even when it
                        // is not being applied, so the blend mode proves nothing on
                        // its own. What decides it is whether the layers sit in a 3D
                        // rendering context: `perspective` on the slot is fine, but a
                        // card with `preserve-3d` extends that context over the gloss,
                        // and there the overlays lose their backdrop and paint at full
                        // strength. Frozen mid-flip at a fixed transform, that is a
                        // mean luminance of 94 instead of 80 — a milky wash.
                        check(
                            'the slot may carry perspective',
                            getComputedStyle(slot).perspective !== 'none',
                            getComputedStyle(slot).perspective
                        );
                        check(
                            'but the card must not extend a 3D context over the gloss',
                            getComputedStyle(card).transformStyle === 'flat',
                            getComputedStyle(card).transformStyle
                        );

                        // The reflection must ease in once the card has landed,
                        // rather than snapping on the moment the back is rendered.
                        // Asserted as three deterministic facts rather than by
                        // sampling the animation, which would race with the clock.
                        if (back) {
                            var before = getComputedStyle(back, '::before');
                            var easing = before.transitionDuration;
                            var resting = parseFloat(before.getPropertyValue('--gloss-rest'));

                            check(
                                'the reflection eases rather than snapping on',
                                easing !== '0s' && parseFloat(easing) > 0.1,
                                easing
                            );
                            check(
                                'the reflection eases up to a visible strength',
                                resting > 0.5,
                                String(resting)
                            );

                            // And it is held back entirely while the card turns.
                            card.className = 'card card--back flip-out';
                            var held = getComputedStyle(back, '::before').opacity;
                            check('the reflection is hidden while the card flips', held === '0', held);
                        }

                        report();
                    }, 2600);
                }

                /* ------------------------------------------------------------ locale */

                // The page ships in English and Brazilian Portuguese. `?lang=`
                // pins a language for a link; the flag button switches at
                // runtime. Both must translate the chrome, the deck content, the
                // status line and the numbers, without re-dealing the match.
                function localeCase() {
                    var I18n = window.TrunfoI18n;
                    var Deck = window.TrunfoDeck;
                    var button = byId('locale');
                    var portugueseFlag = '🇧🇷';
                    var englishFlag = '🇬🇧';
                    var fromQuery = location.search.indexOf('lang=pt-BR') !== -1;

                    check('the i18n module loaded', typeof I18n === 'object');
                    check('the language button is offered', button !== null);
                    check(
                        'the switch is a single flag button, not a picker',
                        button && button.tagName === 'BUTTON' && button.options === undefined,
                        button ? button.tagName : 'missing'
                    );
                    check(
                        'the button carries the active language flag',
                        button.textContent.trim() === (fromQuery ? portugueseFlag : englishFlag),
                        button.textContent.trim()
                    );
                    check(
                        'the button names the switch it performs',
                        button.getAttribute('aria-label') ===
                            (fromQuery ? 'Mudar o idioma para English' : 'Switch language to Português (BR)'),
                        button.getAttribute('aria-label')
                    );
                    check(
                        'the tooltip matches the accessible name',
                        button.title === button.getAttribute('aria-label'),
                        button.title
                    );
                    check(
                        'the flag is the only thing a sighted user sees',
                        button.textContent.trim() === button.querySelector('.flag').textContent.trim() &&
                            button.querySelector('.flag').getAttribute('aria-hidden') === 'true',
                        button.textContent
                    );
                    check(
                        fromQuery ? '?lang=pt-BR switches the page on load' : 'the page starts in English',
                        I18n.locale() === (fromQuery ? 'pt-BR' : 'en'),
                        I18n.locale()
                    );
                    check(
                        'the document language attribute follows the locale',
                        document.documentElement.lang === I18n.locale(),
                        document.documentElement.lang
                    );

                    window.TrunfoUI.configure({ fast: true, ai: 'random' });
                    window.TrunfoUI.startGame();
                    var state = window.TrunfoUI.getState();
                    var card = state.playerHand[0];

                    function labels() {
                        return Array.prototype.map
                            .call(document.querySelectorAll('#player-card .attr__label'), function (node) {
                                return node.firstChild.textContent.trim();
                            })
                            .join(', ');
                    }

                    function expectPortuguese() {
                        var pt = Deck.translator('awesome-animals', 'pt-BR');
                        check(
                            'the card banner names the deck in Portuguese',
                            document.querySelector('#player-card .banner__text').textContent ===
                                'Animais Incríveis',
                            document.querySelector('#player-card .banner__text').textContent
                        );
                        check(
                            'the stat labels come from the deck translation',
                            labels() === 'Tamanho, Velocidade, Tempo de vida',
                            labels()
                        );
                        check(
                            'the card name is translated',
                            document.querySelector('#player-card .face__name').textContent ===
                                pt.name(card.name),
                            document.querySelector('#player-card .face__name').textContent +
                                ' vs ' +
                                card.name
                        );
                        check(
                            'the counter reads in Portuguese',
                            /cartas?$/.test(
                                document.querySelector('.side--player .counter').textContent.trim()
                            ),
                            document.querySelector('.side--player .counter').textContent
                        );
                        check(
                            'the status line is translated',
                            /Escolha uma categoria/.test(byId('message').textContent),
                            byId('message').textContent
                        );
                        check(
                            'the static chrome is translated',
                            /Como jogar/.test(byId('rules-title').textContent) &&
                                /Regras/.test(byId('rules-btn').textContent),
                            byId('rules-title').textContent + ' / ' + byId('rules-btn').textContent
                        );
                        check(
                            'the deck picker lists the built-in decks in Portuguese',
                            /Animais Incríveis/.test(byId('deck-select').textContent) &&
                                /Carros Elétricos 2026/.test(byId('deck-select').textContent),
                            byId('deck-select').textContent
                        );
                        check(
                            'the brand tag names the deck in Portuguese',
                            byId('brand-tag').textContent === 'Animais Incríveis',
                            byId('brand-tag').textContent
                        );
                        check(
                            'numbers are formatted for the locale',
                            I18n.number(1020) === '1.020',
                            I18n.number(1020)
                        );
                    }

                    if (fromQuery) {
                        expectPortuguese();
                        report();
                        return;
                    }

                    check(
                        'the English deck content is in place first',
                        document.querySelector('#player-card .banner__text').textContent ===
                            'Awesome Animals',
                        document.querySelector('#player-card .banner__text').textContent
                    );

                    I18n.setLocale('pt-BR');
                    expectPortuguese();
                    check(
                        'switching language does not re-deal the match',
                        window.TrunfoUI.getState() === state &&
                            window.TrunfoUI.getState().playerHand[0] === card,
                        'the same state object'
                    );

                    var storageWorks = true;
                    try {
                        window.localStorage.setItem('trunfo.probe', '1');
                        window.localStorage.removeItem('trunfo.probe');
                    } catch (error) {
                        storageWorks = false;
                    }
                    if (storageWorks) {
                        check(
                            'the choice is remembered for the next visit',
                            window.localStorage.getItem('trunfo.locale.v1') === 'pt-BR',
                            String(window.localStorage.getItem('trunfo.locale.v1'))
                        );
                    }

                    // In Portuguese the same button offers English back.
                    check(
                        'the button names the other language after a switch',
                        button.getAttribute('aria-label') === 'Mudar o idioma para English',
                        button.getAttribute('aria-label')
                    );
                    check(
                        'the flag still shows the language in use',
                        button.textContent.trim() === portugueseFlag,
                        button.textContent.trim()
                    );

                    // The button itself is the user's path to the same call.
                    button.click();
                    check('the button switches back', I18n.locale() === 'en', I18n.locale());
                    check(
                        'the flag follows the language back',
                        button.textContent.trim() === englishFlag,
                        button.textContent.trim()
                    );
                    check(
                        'the deck content returns to English',
                        document.querySelector('#player-card .banner__text').textContent ===
                            'Awesome Animals',
                        document.querySelector('#player-card .banner__text').textContent
                    );
                    check('the English stat labels are back', labels() === 'Size, Speed, Lifespan', labels());
                    check(
                        'the html lang attribute followed it back',
                        document.documentElement.lang === 'en',
                        document.documentElement.lang
                    );
                    check(
                        'the match still stands',
                        window.TrunfoUI.getState() === state,
                        'the same state object'
                    );
                    check(
                        'the button reflects the active language',
                        button.getAttribute('aria-label') === 'Switch language to Português (BR)',
                        button.getAttribute('aria-label')
                    );

                    report();
                }

                var CASES = {
                    playthrough: playthrough,
                    draw: draw,
                    long: longGame,
                    responsive: responsive,
                    solo: solo,
                    customDeck: customDeck,
                    cars: cars,
                    superTrunfo: superTrunfo,
                    lowerWins: lowerWins,
                    paper: paper,
                    flip: flip,
                    locale: localeCase,
                    localeParam: localeCase
                };

                window.addEventListener('load', function () {
                    (CASES[CASE] || playthrough)();
                });
            })();
        </script>
    </body>
</html>
