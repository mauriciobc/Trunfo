<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Trunfo — browser harness</title>
        <link rel="stylesheet" href="../src/css/styles.css" />
    </head>
    <body>
        <div class="app">
            <header class="topbar">
                <div class="brand">
                    <span class="brand__mark" aria-hidden="true">T</span>
                    <span class="brand__name">Trunfo</span>
                    <span class="brand__tag" id="brand-tag">Browser test</span>
                </div>
                <div class="topbar__actions">
                    <label class="visually-hidden" for="deck-select" data-i18n="game.deck">Deck</label>
                    <select id="deck-select" class="select"></select>
                    <button
                        id="speed-btn"
                        class="btn btn--ghost"
                        type="button"
                        aria-pressed="false"
                        title="Shorten the reveal and think time"
                        data-i18n="game.fast"
                        data-i18n-title="game.fastTitle"
                    >
                        Fast
                    </button>
                    <button
                        id="rules-btn"
                        class="btn btn--ghost"
                        type="button"
                        title="How to play"
                        data-i18n="game.rules"
                        data-i18n-title="game.rulesTitle"
                    >
                        Rules
                    </button>
                    <button
                        id="restart-btn"
                        class="btn btn--ghost"
                        type="button"
                        hidden
                        data-i18n="game.restart"
                    >
                        Restart
                    </button>
                    <button
                        id="locale"
                        class="btn btn--ghost btn--locale"
                        type="button"
                        data-locale-toggle
                        aria-label="Switch language to Português (BR)"
                    >
                        <span class="flag" aria-hidden="true">🇬🇧</span>
                    </button>
                </div>
            </header>

            <main class="board" id="board">
                <section class="side side--computer">
                    <div class="side__head">
                        <h2 data-i18n="game.computer">Computer</h2>
                        <p class="counter">
                            <span id="computer-count">0</span> <span id="computer-unit">cards</span>
                        </p>
                    </div>
                    <div id="computer-slot" class="card-slot card-slot--computer">
                        <div id="computer-stack" class="card-stack" aria-hidden="true"></div>
                        <div id="computer-card" class="card card--back"></div>
                    </div>
                </section>
                <section class="side side--player">
                    <div class="side__head">
                        <h2 data-i18n="game.you">You</h2>
                        <p class="counter">
                            <span id="player-count">0</span> <span id="player-unit">cards</span>
                        </p>
                    </div>
                    <div id="player-slot" class="card-slot card-slot--player">
                        <div id="player-stack" class="card-stack" aria-hidden="true"></div>
                        <div id="player-card" class="card"></div>
                    </div>
                </section>
            </main>

            <footer class="statusbar">
                <p id="message" class="message" role="status" aria-live="polite" data-i18n="game.idle">
                    Press “Start game” to shuffle and deal.
                </p>
                <div class="statusbar__actions">
                    <p class="round" hidden>
                        <span data-i18n="game.round">Round</span> <span id="round-count">0</span>
                    </p>
                    <p id="pot" class="pot" hidden>
                        <span class="pot__label" data-i18n="game.pot">Pot</span> <span id="pot-count">0</span>
                    </p>
                    <button id="start-btn" class="btn btn--primary" type="button" data-i18n="game.start">
                        Start game
                    </button>
                </div>
            </footer>
        </div>

        <div id="rules" class="overlay" hidden>
            <div class="overlay__panel" role="dialog" aria-modal="true" aria-labelledby="rules-title">
                <h2 id="rules-title" data-i18n="rules.title">How to play</h2>
                <ol class="rules">
                    <li>Test</li>
                </ol>
                <button id="rules-close" class="btn btn--primary" type="button" data-i18n="rules.close">
                    Got it
                </button>
            </div>
        </div>

        <div id="overlay" class="overlay" hidden>
            <div class="overlay__panel" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
                <h2 id="overlay-title" data-i18n="over.title">You win!</h2>
                <p id="overlay-detail" class="overlay__detail"></p>
                <dl id="overlay-stats" class="overlay__stats"></dl>
                <div class="overlay__actions">
                    <button
                        id="overlay-restart"
                        class="btn btn--primary"
                        type="button"
                        data-i18n="over.playAgain"
                    >
                        Play again
                    </button>
                </div>
            </div>
        </div>

        <!-- Results sink: kept out of flow and invisible so it never affects the
         layout measurements, but its text is still in the DOM for --dump-dom. -->
        <pre
            id="out"
            style="
                position: fixed;
                top: 0;
                left: 0;
                width: 1px;
                height: 1px;
                overflow: hidden;
                opacity: 0;
                pointer-events: none;
            "
        >
running</pre>

        <script src="../src/js/i18n.js"></script>
        <script src="../src/js/deck.js"></script>
        <script src="../src/js/engine.js"></script>
        <script src="../src/js/decks.js"></script>
        <script src="../src/js/paper.js"></script>
        <script src="../src/js/ui.js"></script>
        <script>
            (function () {
                'use strict';

                // The harness lives in tests/, so bundled deck artwork has to be
                // resolved against the source tree rather than the page.
                window.TRUNFO_ASSET_BASE = '../src/';

                var Engine = window.TrunfoEngine;
                // Letters and digits only; ids are camelCase (customDeck).
                var CASE = (location.search.match(/case=([A-Za-z0-9]+)/) || [])[1] || 'playthrough';
                var errors = [];
                var CHECKS = [];

                window.addEventListener('error', function (e) {
                    errors.push(String(e.message));
                    // Report straight away: a thrown callback would otherwise
                    // leave the harness silent and look like a timeout.
                    report();
                });
                window.addEventListener('unhandledrejection', function (e) {
                    errors.push('rejection: ' + e.reason);
                });

                function check(name, condition, extra) {
                    CHECKS.push(
                        (condition ? 'PASS' : 'FAIL') +
                            ' ' +
                            name +
                            (extra !== undefined ? ' :: ' + extra : '')
                    );
                }

                function byId(id) {
                    return document.getElementById(id);
                }

                /** Resolve once an <img> has decoded (or clearly failed). */
                function waitForImage(image) {
                    return new Promise(function (resolve) {
                        if (!image) {
                            resolve(false);
                            return;
                        }
                        if (image.complete && image.naturalWidth > 0) {
                            resolve(true);
                            return;
                        }
                        var settled = false;
                        var finish = function (ok) {
                            if (settled) return;
                            settled = true;
                            resolve(ok);
                        };
                        image.addEventListener('load', function () {
                            finish(image.naturalWidth > 0);
                        });
                        image.addEventListener('error', function () {
                            finish(false);
                        });
                        window.setTimeout(function () {
                            finish(image.complete && image.naturalWidth > 0);
                        }, 5000);
                    });
                }

                function overlayVisible() {
                    return byId('overlay').hidden === false;
                }

                function report() {
                    check('no uncaught page errors', errors.length === 0, errors.join(' | '));
                    var failed = CHECKS.filter(function (c) {
                        return c.indexOf('FAIL') === 0;
                    }).length;
                    byId('out').textContent =
                        CHECKS.join('\n') + '\n---\nTOTAL=' + CHECKS.length + ' FAILED=' + failed;
                    document.title = failed ? 'BROWSER-TESTS-FAILED' : 'BROWSER-TESTS-PASSED';
                }

                function bestCategory(state) {
                    var card = Engine.getTopCard(state.playerHand);
                    if (!card) return state.attributeKeys[0];
                    var best = state.attributeKeys[0];
                    var score = -Infinity;
                    state.attributeKeys.forEach(function (key) {
                        // Direction-aware, so a "lowest wins" stat is scored too.
                        var normalised = Engine.attributeScore(state, key, card.attributes[key]);
                        if (normalised > score) {
                            score = normalised;
                            best = key;
                        }
                    });
                    return best;
                }

                /* ---------------------------------------------------- playthrough */

                // Two-card deck: exactly one round decides the game, so the
                // playthrough is quick and its length never depends on the shuffle.
                var PLAYTHROUGH_THEME = {
                    id: 'browser-test',
                    theme: 'Browser Test',
                    attributes: ['size', 'speed'],
                    units: { size: 'cm', speed: 'km/h' },
                    cards: [
                        { name: 'A', attributes: { size: 4, speed: 1 }, icon: '🦁' },
                        { name: 'B', attributes: { size: 1, speed: 2 }, icon: '🐘' }
                    ]
                };

                function playthrough() {
                    var sawFaceDown = false,
                        sawReveal = false,
                        sawEnabledButton = false;
                    var sawStackLayers = false,
                        sawDynamics = false,
                        sawFlip = false,
                        sawStatFill = false;
                    var sawBadge = false,
                        badgeText = '',
                        sawBanner = false,
                        sawArt = false,
                        sawStats = false,
                        sawSeal = false;
                    var sawHighlightSides = false,
                        sawRoundCounter = false;
                    var iterations = 0;

                    function tick() {
                        var state = window.TrunfoUI.getState();
                        if (!state) {
                            finishPlaythrough(null);
                            return;
                        }

                        var badge = document.querySelector('.badge__text');
                        if (badge) {
                            sawBadge = true;
                            badgeText = badge.textContent;
                        }
                        if (document.querySelector('.banner__text')) sawBanner = true;
                        if (document.querySelector('.face__art')) sawArt = true;
                        if (document.querySelectorAll('.attrs .attr').length >= 2) sawStats = true;
                        if (document.querySelector('.seal__text')) sawSeal = true;
                        if (
                            document.querySelector('.card-slot.is-winning .attr.is-winner') &&
                            document.querySelector('.card-slot.is-losing .attr.is-loser')
                        ) {
                            sawHighlightSides = true;
                        }
                        if (document.querySelectorAll('.card-stack__layer').length > 0) sawStackLayers = true;
                        if (document.querySelectorAll('.attr__fill').length > 0) sawStatFill = true;
                        if (
                            document.querySelector(
                                '.card-slot.is-winning, .card-slot.is-losing, .card-slot.is-potted'
                            )
                        ) {
                            sawDynamics = true;
                        }
                        var computerCard = byId('computer-card');
                        if (
                            computerCard.classList.contains('flip-in') ||
                            computerCard.classList.contains('flip-out')
                        ) {
                            sawFlip = true;
                        }
                        if (byId('round-count').textContent === '1') sawRoundCounter = true;

                        if (computerCard.classList.contains('card--back')) sawFaceDown = true;
                        else sawReveal = true;

                        if (state.phase !== 'gameover' && state.turn === 'player') {
                            var button = document.querySelector('#player-card button.attr:not(:disabled)');
                            if (button) {
                                sawEnabledButton = true;
                                button.click();
                            }
                        }

                        if ((state.phase === 'gameover' && overlayVisible()) || iterations++ > 20000) {
                            finishPlaythrough(state);
                            return;
                        }
                        window.setTimeout(tick, 15);
                    }

                    function finishPlaythrough(state) {
                        if (!state) {
                            check('game state created', false, 'no state');
                            report();
                            return;
                        }

                        var counts = {
                            player: state.playerHand.length,
                            computer: state.computerHand.length,
                            drawPile: state.drawPile.length
                        };

                        check('game reached game over', state.phase === 'gameover', String(state.phase));
                        check('a winner is recorded', state.winner !== null, String(state.winner));
                        check(
                            'all cards accounted for',
                            counts.player + counts.computer + counts.drawPile === 2,
                            JSON.stringify(counts)
                        );
                        check('at least one round was played', state.round > 0, 'rounds=' + state.round);
                        check('player could click a category at least once', sawEnabledButton);
                        check('computer card was face down first', sawFaceDown);
                        check('computer card was revealed', sawReveal);
                        check('the round counter tracks play', sawRoundCounter);
                        check('game over overlay is visible', overlayVisible());
                        check(
                            'overlay title is populated',
                            byId('overlay-title').textContent.trim().length > 0,
                            byId('overlay-title').textContent
                        );
                        check(
                            'overlay detail mentions the score',
                            /you \d+, computer \d+/i.test(byId('overlay-detail').textContent),
                            byId('overlay-detail').textContent
                        );
                        check(
                            'overlay summary is populated',
                            byId('overlay-stats').children.length >= 6,
                            byId('overlay-stats').children.length + ' rows'
                        );
                        check(
                            'the computer starts with no fixed mode',
                            state.aiStrategy === Engine.MIXED_AI,
                            state.aiStrategy
                        );
                        check(
                            'no difficulty control is offered',
                            byId('difficulty') === null && byId('deck-select') !== null
                        );
                        check(
                            'a deck with no trump card shows no Super Trunfo seal',
                            document.querySelector('.face.is-super') === null
                        );
                        check(
                            'player counter matches state',
                            byId('player-count').textContent === String(counts.player)
                        );
                        check(
                            'computer counter matches state',
                            byId('computer-count').textContent === String(counts.computer)
                        );
                        check('start button is hidden after game over', byId('start-btn').hidden === true);
                        check('restart button is available', byId('restart-btn').hidden === false);

                        // The badge is the card's code — its group and letter. The
                        // two-card deck here is 1A/1B, so the group is always 1.
                        check(
                            'card renders a numbered badge',
                            sawBadge && /^1[A-D]$/.test(badgeText),
                            JSON.stringify(badgeText)
                        );
                        check('card renders the theme banner', sawBanner);
                        check('card renders a framed art window', sawArt);
                        check('card renders the stats table rows', sawStats);
                        check('card renders the starburst seal', sawSeal);
                        check('winner and loser rows are coloured per side', sawHighlightSides);
                        check('pile stack layers are rendered', sawStackLayers);
                        check('stat magnitude fills are rendered', sawStatFill);
                        check('round dynamics classes were applied', sawDynamics);
                        check('card flip animation was applied', sawFlip);

                        // Stylesheet really applied, probed via computed style because
                        // file:// stylesheets hide cssRules.
                        var probe = document.createElement('div');
                        probe.className = 'card-slot is-losing';
                        var probeCard = document.createElement('div');
                        probeCard.className = 'card';
                        probe.appendChild(probeCard);
                        document.body.appendChild(probe);
                        var probeStyle = window.getComputedStyle(probeCard);
                        var aspect = probeStyle.aspectRatio;
                        var animName = probeStyle.animationName;
                        probe.remove();
                        check(
                            'stylesheet is applied to cards',
                            String(aspect).replace(/\s/g, '') === '5/7',
                            String(aspect)
                        );
                        check(
                            'round dynamics animation resolves',
                            /fly-up/.test(String(animName)),
                            String(animName)
                        );

                        // Accessibility of the modal.
                        var app = document.querySelector('.app');
                        check('background is inert while the dialog is open', app.hasAttribute('inert'));
                        document.dispatchEvent(
                            new KeyboardEvent('keydown', { key: 'Escape', bubbles: true })
                        );
                        check('Escape dismisses the game-over dialog', byId('overlay').hidden === true);
                        check('inert is cleared once the dialog closes', !app.hasAttribute('inert'));

                        report();
                    }

                    window.TrunfoUI.startGame(PLAYTHROUGH_THEME);
                    window.setTimeout(tick, 1200);
                }

                /* ------------------------------------------------------------ draw */

                // Three identical cards: every comparison is a draw, so the pot
                // sweep and the stalemate ending are guaranteed.
                var DRAW_THEME = {
                    id: 'draw-test',
                    theme: 'Draw Test',
                    attributes: ['size', 'speed'],
                    units: { size: 'cm', speed: 'km/h' },
                    cards: [
                        { name: 'A', attributes: { size: 5, speed: 5 }, icon: '🦁' },
                        { name: 'B', attributes: { size: 5, speed: 5 }, icon: '🐘' },
                        { name: 'C', attributes: { size: 5, speed: 5 }, icon: '🐆' }
                    ]
                };

                function draw() {
                    var sawPotted = false,
                        sawPotChip = false,
                        sawDrawRow = false,
                        sawPotBump = false;
                    var iterations = 0;

                    function tick() {
                        var state = window.TrunfoUI.getState();
                        if (!state) {
                            finishDraw(null);
                            return;
                        }

                        if (document.querySelectorAll('.card-slot.is-potted').length === 2) sawPotted = true;
                        if (byId('pot').hidden === false && Number(byId('pot-count').textContent) > 0)
                            sawPotChip = true;
                        if (document.querySelector('.attr.is-draw')) sawDrawRow = true;
                        if (byId('pot').classList.contains('is-bumped')) sawPotBump = true;

                        var button = document.querySelector('#player-card button.attr:not(:disabled)');
                        if (button) button.click();

                        if ((state.phase === 'gameover' && overlayVisible()) || iterations++ > 20000) {
                            finishDraw(state);
                            return;
                        }
                        window.setTimeout(tick, 15);
                    }

                    function finishDraw(state) {
                        if (!state) {
                            check('draw game created', false, 'no state');
                            report();
                            return;
                        }
                        var counts = Engine.getCardCounts(state);

                        check('the draw reached game over', state.phase === 'gameover', String(state.phase));
                        check(
                            'the ending is a stalemate',
                            state.reason === 'stalemate',
                            String(state.reason)
                        );
                        check('nobody won', state.winner === Engine.DRAW, String(state.winner));
                        check('both cards were swept to the pot', sawPotted);
                        check('the compared row is marked as a draw', sawDrawRow);
                        check('the pot chip became visible', sawPotChip);
                        check('the pot chip bumped', sawPotBump);
                        check(
                            'the unclaimed cards stay in the pot',
                            counts.drawPile === 3,
                            JSON.stringify(counts)
                        );
                        check(
                            'overlay explains the draw',
                            /draw|pot/i.test(byId('overlay-detail').textContent),
                            byId('overlay-detail').textContent
                        );
                        check(
                            'cards are conserved',
                            counts.player + counts.computer + counts.drawPile === 3,
                            JSON.stringify(counts)
                        );
                        report();
                    }

                    window.TrunfoUI.configure({ fast: false, ai: 'adaptive' });
                    window.TrunfoUI.startGame(DRAW_THEME);
                    window.setTimeout(tick, 1200);
                }

                /* ------------------------------------------------------------ long */

                // The real 32-card deck played to completion at fast speed.
                function longGame() {
                    var maxRoundsSeen = 0;
                    var iterations = 0;

                    function tick() {
                        var state = window.TrunfoUI.getState();
                        if (!state) {
                            finishLong(null);
                            return;
                        }

                        if (state.round > maxRoundsSeen) maxRoundsSeen = state.round;

                        if (state.phase === 'gameover') {
                            if (!overlayVisible()) {
                                window.setTimeout(tick, 15);
                                return;
                            }
                            finishLong(state);
                            return;
                        }
                        if (iterations++ > 40000) {
                            finishLong(state);
                            return;
                        }

                        if (state.turn === 'player') window.TrunfoUI.onCategory(bestCategory(state));
                        window.setTimeout(tick, 15);
                    }

                    function finishLong(state) {
                        if (!state) {
                            check('long game created', false, 'no state');
                            report();
                            return;
                        }
                        var counts = Engine.getCardCounts(state);

                        check(
                            'a full 32-card game finishes',
                            state.phase === 'gameover',
                            String(state.phase)
                        );
                        check(
                            'it finishes within the round limit',
                            state.round <= state.roundLimit,
                            state.round + ' / ' + state.roundLimit
                        );
                        check('a winner is recorded', state.winner !== null, String(state.winner));
                        // The match ends either by emptying a pile — the winner
                        // then holds all 32 — or on the round-limit backstop,
                        // which decides on pile size. The pinned adaptive chooser
                        // is deterministic, and a deterministic chooser can cycle,
                        // which is exactly what the backstop is for.
                        var wholeDeck =
                            state.winner === 'draw' ||
                            (state.winner === 'player' ? counts.player : counts.computer) === 32;
                        check(
                            'the deck ends by emptying a pile, or on the round-limit backstop',
                            state.reason === 'pile-empty'
                                ? wholeDeck
                                : state.reason === 'round-limit' && state.round >= state.roundLimit,
                            state.reason + ' :: ' + JSON.stringify(counts)
                        );
                        check(
                            'the reason is recorded',
                            typeof state.reason === 'string',
                            String(state.reason)
                        );
                        // The trump rule is played out in the superTrunfo case;
                        // here the shipped deck only has to carry its one trump.
                        var shipped = Engine.createDeck(
                            window.TrunfoDeck.getTheme(window.TrunfoDeck.DEFAULT_THEME_ID)
                        );
                        var trumps = shipped.filter(function (card) {
                            return Engine.isSuperTrunfo(card);
                        });
                        check(
                            'the shipped deck carries its one Super Trunfo card',
                            trumps.length === 1,
                            trumps.length + ' trump card(s)'
                        );
                        check(
                            'every card is accounted for',
                            counts.player + counts.computer + counts.drawPile === 32,
                            JSON.stringify(counts)
                        );
                        check(
                            'the round counter matches the engine',
                            byId('round-count').textContent === String(state.round),
                            byId('round-count').textContent + ' vs ' + state.round
                        );
                        check(
                            'the summary reports every round',
                            byId('overlay-stats').textContent.indexOf(String(state.round)) !== -1
                        );
                        // The mode pinned above is the only one the computer may
                        // have used, and the summary must say so with a count.
                        var summary = Engine.summarise(state);
                        var logged = state.log.filter(function (entry) {
                            return entry.mode === 'adaptive';
                        }).length;
                        var stats = byId('overlay-stats').textContent;
                        check(
                            'the biggest pot row carries its number',
                            /\d+ cards?/.test(stats),
                            stats.slice(0, 200)
                        );
                        // Whether the computer ever led depends on the deal, so
                        // the row must either name the mode with its count or say
                        // there were none.
                        check(
                            'the summary names the mode the computer played, or none',
                            logged > 0
                                ? new RegExp('best number ×' + logged, 'i').test(stats)
                                : /—\s*$/.test(stats.trim()),
                            stats.slice(-70)
                        );
                        check(
                            'the summary count matches the round log',
                            summary.aiModes.adaptive === logged,
                            summary.aiModes.adaptive + ' vs ' + logged + ' logged rounds'
                        );
                        check(
                            'a pinned mode kept the others out of the log',
                            summary.aiModes.random === 0 && summary.aiModes.best === 0,
                            JSON.stringify(summary.aiModes)
                        );
                        check(
                            'the default mixed picker was overridden',
                            state.aiStrategy === 'adaptive',
                            state.aiStrategy
                        );
                        report();
                    }

                    window.TrunfoUI.configure({ fast: true, ai: 'adaptive' });
                    window.TrunfoUI.startGame();
                    window.setTimeout(tick, 900);
                }

                /* ------------------------------------------------------ responsive */

                function responsive() {
                    window.TrunfoUI.configure({ fast: true, ai: 'adaptive' });
                    window.TrunfoUI.startGame();

                    window.setTimeout(function () {
                        var card = byId('player-card');
                        var face = card.querySelector('.face');
                        var banner = card.querySelector('.banner__text');
                        var attrs = card.querySelector('.attrs');
                        var footer = card.querySelector('.face__footer');
                        var head = document.querySelector('.side--player .side__head');
                        var width = card.getBoundingClientRect().width;
                        var overflow = document.documentElement.scrollHeight - window.innerHeight;
                        // The design brief defers mobile: below a 700px-wide desktop
                        // floor a little scrolling is accepted rather than shrinking
                        // the card below legibility.
                        var supported = window.innerWidth >= 700;

                        check('card is at least 150px wide', width >= 150, width.toFixed(0) + 'px');
                        check(
                            supported
                                ? 'the page does not need vertical scrolling'
                                : 'narrow-viewport overflow stays modest',
                            supported ? overflow <= 4 : overflow <= 130,
                            overflow + 'px'
                        );
                        check(
                            'card content fits inside the face',
                            face.scrollHeight <= face.clientHeight + 1,
                            face.scrollHeight + ' vs ' + face.clientHeight
                        );
                        check(
                            'the title banner is not truncated',
                            banner.scrollWidth <= banner.clientWidth + 1,
                            banner.scrollWidth + ' vs ' + banner.clientWidth
                        );
                        check(
                            'the stats table stays inside the card',
                            attrs.getBoundingClientRect().bottom <= card.getBoundingClientRect().bottom + 1
                        );
                        check(
                            'the footer stays on one line',
                            footer.offsetHeight <= 24,
                            footer.offsetHeight + 'px'
                        );
                        check(
                            'the side header stays on one line',
                            head.offsetHeight <= 30,
                            head.offsetHeight + 'px'
                        );
                        check(
