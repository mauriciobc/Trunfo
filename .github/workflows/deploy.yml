name: Verify and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Rapid pushes must not race each other onto Pages.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 22 is the floor for the browser scenarios: the CDP connection uses the
      # global WebSocket, which Node only has from 21 on. See `engines`.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (engine + deck store + localization)
        run: npm test

      - name: Build
        run: npm run build

      # google-chrome is preinstalled on ubuntu-latest, which the runner detects.
      - name: Browser scenarios (minified build)
        run: npm run test:browser:dist

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: deploy to GitHub Pages'
