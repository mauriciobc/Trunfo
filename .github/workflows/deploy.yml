name: Verify and deploy

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Rapid pushes must not race each other onto Pages.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 22 is the floor for the browser scenarios: the CDP connection uses the
      # global WebSocket, which Node only has from 21 on. See `engines`.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Unit tests (engine + deck store + localization)
        run: npm test

      - name: Build
        run: npm run build

      # google-chrome is preinstalled on ubuntu-latest, which the runner detects.
      - name: Browser scenarios (minified build)
        run: npm run test:browser:dist

      # This repository publishes through GitHub Actions (Settings -> Pages ->
      # Source: "GitHub Actions"), so the site is the artifact these steps hand
      # over. Pushing a gh-pages branch, as this workflow used to, publishes
      # nothing at all under that setting.
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload the built site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
